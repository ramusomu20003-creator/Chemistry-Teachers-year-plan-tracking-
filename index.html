<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration - MERN Stack</title>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/axios/dist/axios.min.js"></script>
    
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 40px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px;
            border-radius: 4px;
            text-align: center;
        }
        .success { background-color: #d4edda; color: #155724; }
        .error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>

    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        function RegisterTeacher() {
            const [formData, setFormData] = useState({
                teacherName: '',
                email: '',
                blockName: ''
            });

            const [status, setStatus] = useState({ message: '', type: '' });

            const handleChange = (e) => {
                setFormData({ ...formData, [e.target.name]: e.target.value });
            };

            const handleSubmit = async (e) => {
                e.preventDefault();
                setStatus({ message: '', type: '' });

                try {
                    // Connects to your Express backend endpoint running on port 5000
                    const response = await axios.post('http://localhost:5000/api/teachers/register', formData);
                    
                    setStatus({ 
                        message: response.data.message || 'Teacher registered successfully!', 
                        type: 'success' 
                    });
                    
                    // Reset form fields
                    setFormData({ teacherName: '', email: '', blockName: '' });
                } catch (error) {
                    setStatus({ 
                        message: error.response?.data?.message || 'Failed to connect to the server.', 
                        type: 'error' 
                    });
                }
            };

            return (
                <div className="form-container">
                    <h2>Register Teacher</h2>
                    
                    {status.message && (
                        <div className={`message ${status.type}`}>
                            {status.message}
                        </div>
                    )}

                    <form onSubmit={handleSubmit}>
                        <div className="form-group">
                            <label htmlFor="teacherName">Teacher Name:</label>
                            <input
                                type="text"
                                id="teacherName"
                                name="teacherName"
                                value={formData.teacherName}
                                onChange={handleChange}
                                placeholder="Enter teacher's full name"
                                required
                            />
                        </div>

                        <div className="form-group">
                            <label htmlFor="email">Email Address:</label>
                            <input
                                type="email"
                                id="email"
                                name="email"
                                value={formData.email}
                                onChange={handleChange}
                                placeholder="Enter email address"
                                required
                            />
                        </div>

                        <div className="form-group">
                            <label htmlFor="blockName">Block Name:</label>
                            <select
                                id="blockName"
                                name="blockName"
                                value={formData.blockName}
                                onChange={handleChange}
                                required
                            >
                                <option value="" disabled>-- Select Block Name --</option>
                                <option value="NILGIRI">NILGIRI</option>
                                <option value="ARAVALLI">ARAVALLI</option>
                                <option value="SUMERU">SUMERU</option>
                                <option value="VINDHYA">VINDHYA</option>
                                <option value="HIMADRA">HIMADRA</option>
                                <option value="SAHYADRI">SAHYADRI</option>
                                <option value="PURVANCHAL">PURVANCHAL</option>
                            </select>
                        </div>

                        <button type="submit">Register Teacher</button>
                    </form>
                </div>
            );
        }

        ReactDOM.render(<RegisterTeacher />, document.getElementById('root'));
    </script>

</body>
</html>
