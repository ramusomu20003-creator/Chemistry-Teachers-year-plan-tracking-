<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Teacher Registration</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f4f9;
            margin: 0;
            padding: 20px;
        }
        .form-container {
            max-width: 500px;
            margin: 0 auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
        }
        .form-group {
            margin-bottom: 20px;
        }
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
            color: #333;
        }
        input, select, button {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #007bff;
            color: white;
            font-weight: bold;
            border: none;
            cursor: pointer;
        }
        button:hover {
            background-color: #0056b3;
        }
    </style>
</head>
<body>

    <div class="form-container">
        <h2>Register Teacher</h2>
        <form id="teacherRegistrationForm">
            <div class="form-group">
                <label for="teacherName">Teacher Name:</label>
                <input type="text" id="teacherName" name="teacherName" required placeholder="Enter teacher's full name">
            </div>

            <div class="form-group">
                <label for="email">Email Address:</label>
                <input type="email" id="email" name="email" required placeholder="Enter email address">
            </div>

            <div class="form-group">
                <label for="blockName">Block Name:</label>
                <select id="blockName" name="blockName" required>
                    <option value="" disabled selected>-- Select Block Name --</option>
                    <option value="NILGIRI">NILGIRI</option>
                    <option value="ARAVALLI">ARAVALLI</option>
                    <option value="SUMERU">SUMERU</option>
                    <option value="VINDHYA">VINDHYA</option>
                    <option value="HIMADRA">HIMADRA</option>
                    <option value="SAHYADRI">SAHYADRI</option>
                    <option value="PURVANCHAL">PURVANCHAL</option>
                </select>
            </div>

            <button type="submit">Register Teacher</button>
        </form>
    </div>

    <script>
        const form = document.getElementById('teacherRegistrationForm');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();

            // Gather form data
            const formData = {
                teacherName: document.getElementById('teacherName').value,
                email: document.getElementById('email').value,
                blockName: document.getElementById('blockName').value
            };

            try {
                // Send data to your Node.js/Express backend API
                const response = await fetch('http://localhost:5000/api/teachers/register', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify(formData)
                });

                const result = await response.json();

                if (response.ok) {
                    alert('Teacher registered successfully!');
                    form.reset();
                } else {
                    alert('Error: ' + (result.message || 'Registration failed'));
                }
            } catch (error) {
                console.error('Network error:', error);
                alert('Failed to connect to the server.');
            }
        });
    </script>

</body>
</html>
